<text x="75.00" y="900.00" font-size="18" class="sect" text-anchor="start" >OPENING CONFLICTS / HOLD</text>
<text x="75.00" y="932.00" font-size="16" class="" text-anchor="start" >D01: the architecture description says double-leaf while the current visualization</text>
<text x="75.00" y="955.00" font-size="16" class="" text-anchor="start" >shows a single leaf. Confirm the actual entrance, sidelights and swing per floor;</text>
<text x="75.00" y="978.00" font-size="16" class="" text-anchor="start" >neither depiction is a joinery order.</text>
<text x="75.00" y="1012.00" font-size="16" class="" text-anchor="start" >W03 is roughly centred by homeowner description, not measured. W05 is a 0.75 m visual</text>
<text x="75.00" y="1035.00" font-size="16" class="" text-anchor="start" >placeholder behind a curtain; its real width, jambs and sill/head are unknown.</text>
<text x="75.00" y="1069.00" font-size="16" class="" text-anchor="start" >D03 and D04/D05 hinge/swing are proposed. Confirm existing frames, bathroom door swing</text>
<text x="75.00" y="1092.00" font-size="16" class="" text-anchor="start" >and loft clearance; no re-hanging or cutting is authorised.</text>
<text x="885.00" y="900.00" font-size="18" class="sect" text-anchor="start" >S01 / STAIR — SURVEY, DO NOT SET OUT</text>
<text x="885.00" y="932.00" font-size="16" class="" text-anchor="start" >The model shows two flights and a turning bay beside the balcony. Its 7 and 15 drawn</text>
<text x="885.00" y="955.00" font-size="16" class="" text-anchor="start" >tread lines are illustrative, not verified riser counts.</text>
<text x="885.00" y="989.00" font-size="16" class="" text-anchor="start" >Measure each floor’s rise, tread/going, width, landings, arrival direction, headroom</text>
<text x="885.00" y="1012.00" font-size="16" class="" text-anchor="start" >and guard geometry. Confirm the actual entry connection and the applicable local rules</text>
<text x="885.00" y="1035.00" font-size="16" class="" text-anchor="start" >with the responsible professional.</text>
<text x="885.00" y="1069.00" font-size="16" class="" text-anchor="start" >The master has four requested floor instances F1-F4, but actual storey labels,</text>
<text x="885.00" y="1092.00" font-size="16" class="" text-anchor="start" >elevations and differences are unknown. Record each separately; do not assume four</text>
<text x="885.00" y="1115.00" font-size="16" class="" text-anchor="start" >identical as-built flats.</text>
