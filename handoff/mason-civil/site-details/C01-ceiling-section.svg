<circle cx="715" cy="375" r="8" fill="#fff" stroke="#5d6e77" stroke-width="3"/><circle cx="758" cy="375" r="8" fill="#fff" stroke="#5d6e77" stroke-width="3"/>
<circle cx="690" cy="353" r="7" fill="#d05a3a"/>
<rect x="795" y="302" width="26" height="530" fill="#cfd8d7" stroke="#5d6e77"/>
<rect x="802" y="520" width="15" height="225" fill="#d7ebf2" stroke="#31818d" stroke-width="3"/>
