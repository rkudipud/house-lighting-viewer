<text x="75.00" y="165.00" font-size="18" class="sect" text-anchor="start" >SCHEMATIC SECTION / NOT TO SCALE</text>
<text x="75.00" y="193.00" font-size="16" class="muted" text-anchor="start" >Illustrative section, not verified in R05; pocket, cove and slab are separate conditions.</text>
<rect x="75" y="215" width="790" height="720" fill="#fff" stroke="#cfd9d9" rx="6"/>
<rect x="145" y="270" width="650" height="32" fill="#d9dde0" stroke="#5d6e77"/>
<text x="165.00" y="291.00" font-size="15" class="" text-anchor="start" >Concrete slab (underside reference; not surveyed)</text>
<rect x="145" y="356" width="290" height="12" fill="#fbf4de" stroke="#9e8e62"/>
<path d="M435 362H472V412H645" fill="none" stroke="#9b641c" stroke-width="8"/>
<circle cx="466" cy="388" r="7" fill="#c4872a"/>
