<text x="163.00" y="340.00" font-size="15" class="" text-anchor="start" >A  separate gypsum / POP centre panel</text>
<text x="163.00" y="396.00" font-size="14" class="red" text-anchor="start" >Panel level and cavity unverified</text>
<text x="475.00" y="448.00" font-size="15" class="" text-anchor="start" >B  band + perimeter cove</text>
<text x="475.00" y="470.00" font-size="14" class="muted" text-anchor="start" >Separate LOW lighting</text>
<text x="550.00" y="510.00" font-size="15" class="" text-anchor="start" >C  curtain pocket</text>
<text x="550.00" y="531.00" font-size="14" class="muted" text-anchor="start" >Tracks, brackets and strip profile</text>
<text x="550.00" y="553.00" font-size="14" class="red" text-anchor="start" >fit to be measured</text>
<text x="145.00" y="865.00" font-size="15" class="muted" text-anchor="start" >FFL 0.000  |  window sill / head not measured</text>
<text x="145.00" y="899.00" font-size="16" class="red" text-anchor="start" >NOT an instruction to chase or cut concrete.</text>
<text x="920.00" y="165.00" font-size="18" class="sect" text-anchor="start" >DATUMS / PER FLAT</text>
<text x="920.00" y="198.00" font-size="16" class="" text-anchor="start" >11 ft floor-to-floor (3.3528 m) and about 9 in band drop (0.2286 m):</text>
<text x="920.00" y="221.00" font-size="16" class="" text-anchor="start" >homeowner-stated, not measured.</text>
<text x="920.00" y="255.00" font-size="16" class="" text-anchor="start" >Elsewhere, assumed slab and finish thicknesses yield an old 3.188 m slab and 2.959</text>
<text x="920.00" y="278.00" font-size="16" class="" text-anchor="start" >m band estimate; neither is surveyed.</text>
<text x="920.00" y="312.00" font-size="16" class="" text-anchor="start" >R05 only: band 3.048 m and centre approx. 3.277 m are homeowner-reported, not</text>
<text x="920.00" y="335.00" font-size="16" class="" text-anchor="start" >surveyed.</text>
<text x="920.00" y="369.00" font-size="16" class="" text-anchor="start" >R05 slab unmeasured: the reported centre conflicts with the older slab estimate.</text>
<text x="920.00" y="392.00" font-size="16" class="" text-anchor="start" >The real section and wiring cavity remain unknown.</text>
<text x="920.00" y="426.00" font-size="16" class="" text-anchor="start" >Bathroom, utility, lobby and balcony levels and hall cross-beam soffit are not</text>
<text x="920.00" y="449.00" font-size="16" class="" text-anchor="start" >provided. Measure before coordination.</text>
<text x="920.00" y="499.00" font-size="18" class="sect" text-anchor="start" >COVE IS NOT THE CURTAIN POCKET</text>
<text x="920.00" y="531.00" font-size="16" class="" text-anchor="start" >Cove: perimeter ceiling-light feature, fixed 2700 K. Curtain pocket: concealed</text>
<text x="920.00" y="554.00" font-size="16" class="" text-anchor="start" >ceiling-track recess at a window; it is not automatically an LED cove.</text>
<text x="920.00" y="588.00" font-size="16" class="" text-anchor="start" >Living, master and children: two tracks, sheer plus blackout. Selected S1 strips</text>
<text x="920.00" y="611.00" font-size="16" class="" text-anchor="start" >add a separate 2700 K profile within four pocket locations, only if site fit,</text>
<text x="920.00" y="634.00" font-size="16" class="" text-anchor="start" >access and clearance are verified.</text>
<text x="920.00" y="668.00" font-size="16" class="" text-anchor="start" >CURT-LIV, CURT-DIN, CURT-MBR-S and CURT-CBR selected for review. CURT-MBR-W03</text>
<text x="920.00" y="691.00" font-size="16" class="" text-anchor="start" >remains held and excluded. Do not fabricate from assumed strip centre-lines.</text>
<text x="75.00" y="1000.00" font-size="18" class="sect" text-anchor="start" >SITE MOCK-UP BEFORE CLOSING THE CEILING</text>
<text x="75.00" y="1032.00" font-size="16" class="" text-anchor="start" >Measure pocket clear width and depth, return lengths, two-track spacing, curtain stack, brackets and the strip/profile/lip. Confirm the source is concealed at standing and seated</text>
<text x="75.00" y="1055.00" font-size="16" class="" text-anchor="start" >eye height.</text>
<text x="75.00" y="1088.00" font-size="16" class="" text-anchor="start" >Confirm profile fixing, cable bends, ventilated and accessible drivers / junctions, the HIGH versus LOW local controls and the selected dimmer/fitting chain with the electrician.</text>
<text x="75.00" y="1121.00" font-size="16" class="" text-anchor="start" >MBR-S and CBR assumed strip returns run about 0.30 m beyond their model room corners. This is a model clash, not a site measurement; resolve after measuring actual ends.</text>
<path d="M60 1336H1640" stroke="#c8d2d3"/>
<text x="60.00" y="1358.00" font-size="12.5" class="mono muted" text-anchor="start" >Master SHA256: 79ece2aef1acd63ee401702149a91e29a6ed660123c4d9d3640ab5304ed89822</text>
<text x="1640.00" y="1358.00" font-size="13" class="amber" text-anchor="end" >Read-only drawing from the canonical master · not a construction release · unmeasured levels and sizes marked</text>
