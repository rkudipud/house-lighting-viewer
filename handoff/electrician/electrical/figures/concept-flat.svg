<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#435b60"/></marker>
</defs>
<rect width="1160" height="700" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20343b">
  <text x="35" y="42" font-size="24" font-weight="bold">One flat: independent local LOW, HIGH and essential groups</text>
  <text x="35" y="68" font-size="14">Functional block diagram only. No terminal wiring, device sizing or construction approval.</text>
  <rect x="35" y="112" width="210" height="110" rx="8" fill="#ecf1f0" stroke="#698a8b" stroke-width="2"/>
  <text x="140" y="144" text-anchor="middle" font-size="18" font-weight="bold">This flat's</text>
  <text x="140" y="167" text-anchor="middle" font-size="18" font-weight="bold">lighting supply</text>
  <text x="140" y="194" text-anchor="middle" font-size="13">Protection / isolation</text>
  <text x="140" y="211" text-anchor="middle" font-size="13">by qualified designer</text>
  <rect x="330" y="92" width="230" height="95" rx="8" fill="#fff0d6" stroke="#b87726" stroke-width="2"/>
  <text x="445" y="122" text-anchor="middle" font-size="18" font-weight="bold">LOW wall knob</text>
  <text x="445" y="147" text-anchor="middle" font-size="13">24 V CV supply + PWM</text>
  <text x="445" y="166" text-anchor="middle" font-size="13">controller/repeaters: HOLD</text>
  <rect x="650" y="92" width="390" height="95" rx="8" fill="#fff7eb" stroke="#b87726" stroke-width="2"/>
  <text x="845" y="122" text-anchor="middle" font-size="18" font-weight="bold">2700 K warm cove / mood / pocket strips</text>
  <text x="845" y="147" text-anchor="middle" font-size="13">Existing LOW controls; pocket lengths unmeasured</text>
  <text x="845" y="166" text-anchor="middle" font-size="13">Photometric credit for pocket strips: none</text>
  <rect x="330" y="242" width="230" height="95" rx="8" fill="#e8f1f8" stroke="#4f8fbf" stroke-width="2"/>
  <text x="445" y="272" text-anchor="middle" font-size="18" font-weight="bold">HIGH wall dimmer</text>
  <text x="445" y="297" text-anchor="middle" font-size="13">Exact LED / driver /</text>
  <text x="445" y="316" text-anchor="middle" font-size="13">dimmer match: HOLD</text>
  <rect x="650" y="242" width="390" height="95" rx="8" fill="#f3f8fc" stroke="#4f8fbf" stroke-width="2"/>
  <text x="845" y="273" text-anchor="middle" font-size="18" font-weight="bold">Fixed functional lighting</text>
  <text x="845" y="298" text-anchor="middle" font-size="13">Room-specific 3000 K or 4000 K</text>
  <text x="845" y="317" text-anchor="middle" font-size="13">Separate task, face and wet-area controls</text>
  <rect x="330" y="392" width="710" height="100" rx="8" fill="#f3f5f4" stroke="#8ba1a0" stroke-width="2"/>
  <text x="685" y="425" text-anchor="middle" font-size="18" font-weight="bold">Other local groups remain independently controlled</text>
  <text x="685" y="451" text-anchor="middle" font-size="13">Pooja strip and spot separate; C10 passage dimmable; readers and PIR integral.</text>
  <text x="685" y="473" text-anchor="middle" font-size="13">Inverter / track / wet-zone details and product approvals remain open.</text>
  <path d="M245 150 H330 M560 140 H650 M140 222 V288 H330 M560 289 H650 M140 288 V440 H330" stroke="#435b60" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="35" y="550" width="1090" height="98" rx="8" fill="#fff1ed" stroke="#be674a" stroke-width="2"/>
  <text x="55" y="579" font-size="16" font-weight="bold">Four flats = four independent supplies / neutrals / control domains.</text>
  <text x="55" y="603" font-size="14">Common stairs have a separate building supply and control. No app or internet is required for the intended local operation.</text>
  <text x="55" y="627" font-size="14">A physically daisy-chained cable is not a series-connected LED load; constant-current connections follow the actual driver instructions.</text>
</g>
</svg>
