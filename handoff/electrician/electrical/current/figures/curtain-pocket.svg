<text x="555.0" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="end" font-weight="normal" fill="#7a3fa0">24 V knob output (room LOW knob)</text>
<text x="60.0" y="452.0" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#8b1e1e">Check on site: pocket width and depth; both tracks + brackets + stack fit; fabric never touches strip/profile; strip not visible from seated/standing eye height; dust access.</text>
