<text x="50.00" y="154.00" font-size="15" text-anchor="start" style="fill:#172b39;font-weight:normal">Unit height 800 mm (2 ft 7 in) FFL; reference loft (if shown) is not a measured section.</text>
<text x="50.00" y="790.00" font-size="15" text-anchor="start" style="fill:#172b39;font-weight:normal">One shelf at 400 mm (1 ft 4 in) FFL is a concept only; relocate/remove if plumbing or services require it.</text>
<text x="50.00" y="814.00" font-size="15" text-anchor="start" style="fill:#172b39;font-weight:normal">Selected under-counter shutters are allowed; any carcass, base, partition and shelf need a separate quote.</text>
<text x="50.00" y="838.00" font-size="15" text-anchor="start" style="fill:#172b39;font-weight:normal">Measure counter, drainage and door swing; keep chemicals safely stored away from children.</text>
<text x="50.00" y="862.00" font-size="15" text-anchor="start" style="fill:#172b39;font-weight:normal">The loft above is a separate assumed envelope; no new corner-enclosing utility wall is proposed.</text>
