<text x="50.00" y="42.00" font-size="26" text-anchor="start" style="fill:#172b39;font-weight:bold">R08 | UTILITY UNDER-COUNTER | INTERIOR ELEVATION</text>
<text x="50.00" y="72.00" font-size="16" text-anchor="start" style="fill:#172b39;font-weight:normal">Widths are placeholders. Heights are FFL working targets; shelves and supports remain adjustable.</text>
