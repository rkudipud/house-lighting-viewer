<text x="45.00" y="785.00" font-size="16" text-anchor="start" style="fill:#172b39;font-weight:normal">SH01: 1.200 x 0.350 x 0.900 m proposed; up to about 16 pairs only if the actual pairs fit.</text>
<text x="45.00" y="809.00" font-size="16" text-anchor="start" style="fill:#172b39;font-weight:normal">Confirm door/gate and stair/arrival egress on site. No reduction of required escape width is approved.</text>
<text x="45.00" y="833.00" font-size="16" text-anchor="start" style="fill:#172b39;font-weight:normal">No fabrication location is implied by this isolated unit view; exposure, fixings and anti-tip restraint require checking.</text>
<text x="45.00" y="857.00" font-size="16" text-anchor="start" style="fill:#172b39;font-weight:normal">Shoe cabinet is included in required ancillary cost; it is repeated in every flat, not a building-common item.</text>
