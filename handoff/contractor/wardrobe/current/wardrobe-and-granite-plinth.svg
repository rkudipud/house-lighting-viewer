<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1188 840" role="img" aria-labelledby="title description">
  <title id="title">Master wardrobe and granite plinth - homeowner review</title>
  <desc id="description">A schematic front view of the master bedroom split wardrobe around window W03 and a representative side section showing a BWP plywood wardrobe carcass, laminate shutter and granite plinth. The owner selected the materials and master split, but dimensions, plinth construction, supports, moisture protection and joinery remain unverified. Not for fabrication.</desc>
  <rect width="1188" height="840" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1c3439">
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="40" font-size="15" font-weight="bold" letter-spacing="1.5" fill="#426d68">HOUSE HANDOFF / WARDROBE</text>
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="80" font-size="32" font-weight="bold">Wardrobe and granite plinth</text>
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="108" font-size="16">A material and layout review - not a measured shop drawing</text>
    <rect x="844" y="34" width="296" height="74" rx="5" fill="#fff5df" stroke="#ad7625" stroke-width="1.5"/>
    <text font-family="Arial, Helvetica, sans-serif" x="862" y="63" font-size="16" font-weight="bold" fill="#674312">DESIGN REVIEW ONLY</text>
    <text font-family="Arial, Helvetica, sans-serif" x="862" y="87" font-size="16" font-weight="bold" fill="#674312">NOT FOR FABRICATION</text>
    <line x1="48" y1="130" x2="1140" y2="130" stroke="#d4dfdc" stroke-width="2"/>

    <rect x="48" y="152" width="622" height="438" rx="5" fill="#fafbf9" stroke="#cddbd6" stroke-width="1.5"/>
    <text font-family="Arial, Helvetica, sans-serif" x="70" y="181" font-size="15" font-weight="bold" letter-spacing="1" fill="#426d68">01 / MASTER BEDROOM</text>
    <text font-family="Arial, Helvetica, sans-serif" x="70" y="210" font-size="23" font-weight="bold">Split wardrobe - front view</text>
    <text font-family="Arial, Helvetica, sans-serif" x="70" y="234" font-size="15">Split around window W03 is selected in principle.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="70" y="255" font-size="15">Loft and curtain-pocket interface omitted: unmeasured.</text>

    <rect x="100" y="292" width="174" height="208" fill="#ece7df" stroke="#415a56" stroke-width="2"/>
    <rect x="446" y="292" width="174" height="208" fill="#ece7df" stroke="#415a56" stroke-width="2"/>
    <path d="M158 304 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12
             M216 304 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12
             M504 304 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12
             M562 304 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12 m0 12 v12"
          fill="none" stroke="#8b9b95" stroke-width="1.5"/>
    <rect x="123" y="371" width="128" height="27" fill="#ece7df"/>
    <rect x="469" y="371" width="128" height="27" fill="#ece7df"/>
    <text font-family="Arial, Helvetica, sans-serif" x="187" y="390" font-size="15" font-weight="bold" text-anchor="middle">WARDROBE</text>
    <text font-family="Arial, Helvetica, sans-serif" x="533" y="390" font-size="15" font-weight="bold" text-anchor="middle">WARDROBE</text>
    <rect x="306" y="332" width="108" height="112" fill="#e2eff1" stroke="#547c83" stroke-width="2"/>
    <text font-family="Arial, Helvetica, sans-serif" x="360" y="375" font-size="16" font-weight="bold" text-anchor="middle">W03</text>
    <text font-family="Arial, Helvetica, sans-serif" x="360" y="396" font-size="14" text-anchor="middle">WINDOW</text>
    <text font-family="Arial, Helvetica, sans-serif" x="360" y="416" font-size="13" text-anchor="middle">unmeasured</text>
    <rect x="100" y="500" width="174" height="20" fill="#58696a" stroke="#344c4c" stroke-width="1.5"/>
    <rect x="446" y="500" width="174" height="20" fill="#58696a" stroke="#344c4c" stroke-width="1.5"/>
    <path d="M110 508 h10 M136 514 h8 M164 507 h9 M196 514 h11 M230 508 h9 M456 508 h10 M482 514 h8 M510 507 h9 M542 514 h11 M576 508 h9" fill="none" stroke="#d8e2df" stroke-width="1.5"/>
    <line x1="86" y1="521" x2="634" y2="521" stroke="#415a56" stroke-width="2"/>
    <path d="M187 520 V540 H358" fill="none" stroke="#587670" stroke-width="1.5"/>
    <text font-family="Arial, Helvetica, sans-serif" x="369" y="545" font-size="15" font-weight="bold">Granite plinths</text>
    <text font-family="Arial, Helvetica, sans-serif" x="70" y="570" font-size="14">Dashed bay lines are illustrative, not approved door divisions.</text>

    <rect x="690" y="152" width="450" height="438" rx="5" fill="#fafbf9" stroke="#cddbd6" stroke-width="1.5"/>
    <text font-family="Arial, Helvetica, sans-serif" x="712" y="181" font-size="15" font-weight="bold" letter-spacing="1" fill="#426d68">02 / WARDROBE BASE</text>
    <text font-family="Arial, Helvetica, sans-serif" x="712" y="210" font-size="23" font-weight="bold">Plinth - side section</text>
    <text font-family="Arial, Helvetica, sans-serif" x="712" y="234" font-size="15">Material relationship only; the assembly is not selected.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="724" y="275" font-size="14" fill="#526967">WALL</text>
    <text font-family="Arial, Helvetica, sans-serif" x="1045" y="275" font-size="14" fill="#526967">ROOM</text>
    <rect x="743" y="290" width="8" height="211" fill="#8c9c96"/>
    <path d="M773 292 H924" fill="none" stroke="#415a56" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="773" y="292" width="13" height="157" fill="#d5bf9e" stroke="#415a56" stroke-width="1.5"/>
    <rect x="786" y="292" width="138" height="157" fill="#ffffff"/>
    <rect x="773" y="449" width="151" height="13" fill="#d5bf9e" stroke="#415a56" stroke-width="1.5"/>
    <rect x="924" y="292" width="11" height="170" fill="#e5ddd1" stroke="#415a56" stroke-width="1.5"/>
    <rect x="773" y="462" width="162" height="39" fill="#58696a" stroke="#344c4c" stroke-width="1.5"/>
    <path d="M784 472 h12 M811 485 h9 M842 475 h9 M875 489 h12 M905 474 h11" fill="none" stroke="#d8e2df" stroke-width="1.5"/>
    <line x1="727" y1="502" x2="1112" y2="502" stroke="#415a56" stroke-width="2"/>
    <path d="M930 323 H950" fill="none" stroke="#587670" stroke-width="1.5"/>
    <text font-family="Arial, Helvetica, sans-serif" x="958" y="319" font-size="14" font-weight="bold">MATTE-LAMINATE</text>
    <text font-family="Arial, Helvetica, sans-serif" x="958" y="337" font-size="14">shutter</text>
    <path d="M847 455 H940 V405 H950" fill="none" stroke="#587670" stroke-width="1.5"/>
    <circle cx="847" cy="455" r="3" fill="#587670"/>
    <text font-family="Arial, Helvetica, sans-serif" x="958" y="401" font-size="14" font-weight="bold">BWP PLYWOOD</text>
    <text font-family="Arial, Helvetica, sans-serif" x="958" y="419" font-size="14">carcass and base</text>
    <path d="M925 482 H935" fill="none" stroke="#d8e2df" stroke-width="1.5"/>
    <path d="M935 482 H950" fill="none" stroke="#587670" stroke-width="1.5"/>
    <text font-family="Arial, Helvetica, sans-serif" x="958" y="473" font-size="14" font-weight="bold">GRANITE</text>
    <text font-family="Arial, Helvetica, sans-serif" x="958" y="491" font-size="14">plinth zone</text>
    <text font-family="Arial, Helvetica, sans-serif" x="712" y="535" font-size="14">Floor level, wall gap and ventilation are unverified.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="712" y="556" font-size="14">Plinth shape, build-up, fixing and damp protection are</text>
    <text font-family="Arial, Helvetica, sans-serif" x="712" y="575" font-size="14">unresolved; this symbol does not specify solid or clad stone.</text>

    <line x1="48" y1="612" x2="1140" y2="612" stroke="#d4dfdc" stroke-width="2"/>
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="641" font-size="16" font-weight="bold" letter-spacing="0.5" fill="#426d68">SELECTED BY THE HOMEOWNER</text>
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="670" font-size="15">BWP plywood carcasses with matte-laminate shutters.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="694" font-size="15">Wardrobe granite: plinths only, not shelves or back-lining.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="718" font-size="15">Two master trays; one children's tray; six children's loft doors.</text>
    <rect x="48" y="734" width="16" height="16" fill="#202020"/>
    <text font-family="Arial, Helvetica, sans-serif" x="74" y="748" font-size="15">Matte-black handle finish; shape and position remain open.</text>

    <text font-family="Arial, Helvetica, sans-serif" x="631" y="641" font-size="16" font-weight="bold" letter-spacing="0.5" fill="#426d68">MEASURE AND RESOLVE BEFORE WORK</text>
    <text font-family="Arial, Helvetica, sans-serif" x="631" y="670" font-size="15">All widths, heights, depth and plinth level on site.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="631" y="694" font-size="15">Stone thickness, support, anchorage and moisture protection.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="631" y="718" font-size="15">Loft support, curtain pocket and suitcase access with doors open.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="631" y="742" font-size="15">Door operation, fittings, interiors and loads remain unverified.</text>

    <line x1="48" y1="775" x2="1140" y2="775" stroke="#d4dfdc" stroke-width="1.5"/>
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="800" font-size="14">Diagrammatic, not to scale. Colours and shapes are not finish samples or selected construction details.</text>
    <text font-family="Arial, Helvetica, sans-serif" x="48" y="820" font-size="14">Basis: 18 November owner and material selections and the provisional master split review.</text>
  </g>
</svg>
